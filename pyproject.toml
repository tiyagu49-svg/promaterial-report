[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mas_platform"
version = "0.1.0"
description = "Evolutionary multi-agent collaboration platform (ARIN5202 final project)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "odfpy>=1.4",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pdfplumber>=0.11",
    "pydantic>=2.5",
    "pyarrow>=15.0",
    "python-docx>=1.1",
    "streamlit>=1.40",
    "xlrd>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mas = "mas_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
